# Alembic configuration for the SIS service.
#
#     pip install -r sis/requirements.txt
#     alembic -c sis/alembic.ini upgrade head
#     alembic -c sis/alembic.ini revision --autogenerate -m "add x" --rev-id 0002
#
# Every path below is written against %(here)s -- the directory holding this file --
# rather than against the process's working directory. That is the whole point of the
# token: a relative `script_location = migrations` resolves from wherever the operator
# happened to be standing, so `alembic -c sis/alembic.ini upgrade head` from the repo
# root would report "Path doesn't exist: migrations" while the identical command from
# inside sis/ worked. A deploy script and a developer would then disagree about whether
# the migration ran at all, which is the failure this service can least afford.

[alembic]
script_location = %(here)s/migrations

# Puts the repository root -- not sis/ -- on sys.path, so `import sis.config` resolves
# inside env.py no matter where alembic was launched from.
prepend_sys_path = %(here)s/..

# Revisions are numbered, not hashed, so `ls versions/` reads in apply order. Alembic
# will still mint a random hex id unless the operator passes --rev-id, so pass it: a
# `a3f9c1_add_x.py` sorting between 0001 and 0002 makes the history unreadable exactly
# when someone is trying to work out what a broken deploy has already applied.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately ABSENT. A connection string in a checked-in file is a
# credential in git, and worse, it is the one every environment silently falls back to
# when its own variable is unset -- which is how a migration lands on the wrong
# database. env.py reads SIS_DATABASE_URL instead (see sis/config.py), and accepts a
# one-off override via `alembic -c sis/alembic.ini -x db_url=... upgrade head`.
#
# `timezone` is also intentionally unset: it resolves through zoneinfo, which has no
# tz database on Windows unless the `tzdata` package is installed, and a missing
# optional dependency must not be the reason a schema upgrade cannot run.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
