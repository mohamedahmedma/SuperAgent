name: Production pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/superagent
  VITE_IDENTITY_BASE_URL: https://auth.aurexis.cc

jobs:
  ci:
    name: Stage 1 - CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  cd:
    name: Stage 2 - CD - ${{ matrix.name }} image
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: backend, file: Dockerfile}
          - {name: frontend, file: frontend/Dockerfile}
          - {name: identity, file: identity/Dockerfile}
          - {name: records, file: records/Dockerfile}
          - {name: sis, file: sis/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:stable
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VITE_IDENTITY_BASE_URL=${{ matrix.name == 'frontend' && env.VITE_IDENTITY_BASE_URL || '' }}

  deploy:
    name: Stage 3 - Deploy production (approval required)
    needs: cd
    runs-on: ubuntu-latest
    # Configure `production` in GitHub Settings with both maintainers as required
    # reviewers. GitHub pauses this job here; either one may approve it.
    environment:
      name: production
    env:
      DEPLOY_HOST: 13.140.153.131
      DEPLOY_PORT: '22'
      DEPLOY_USER: root
      DEPLOY_PATH: /opt/superagent
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
      # Only consulted when a certificate is missing. An estate whose certificates are
      # already issued deploys without it.
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH SSHPASS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deployment configuration:$missing"
            exit 1
          fi
          case "$DEPLOY_PORT" in
            *[!0-9]*|'') echo "::error::DEPLOY_PORT must be numeric"; exit 1 ;;
          esac
      - name: Install SSH password client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Trust deployment server
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/hostkeys || true
          if ! [ -s /tmp/hostkeys ]; then
            echo "::error::No SSH host key received from $DEPLOY_HOST:$DEPLOY_PORT"
            exit 1
          fi
          cat /tmp/hostkeys >> ~/.ssh/known_hosts
      - name: Prepare server and copy Compose configuration
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          sshpass -e scp -P "$DEPLOY_PORT" docker-compose.yml docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # The public-domain configuration is repository-managed, so it ships with every
          # release and an edit made on the server does not survive one.
          sshpass -e scp -P "$DEPLOY_PORT" -r deploy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Install production environment and authenticate registry
        run: |
          # PROD_ENV_FILE bootstraps a new estate only. Once present, the server's
          # operator-validated .env is persistent state and must survive deployments.
          if sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/.env'"; then
            sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "chown root:root '$DEPLOY_PATH/.env' && chmod 600 '$DEPLOY_PATH/.env' && test \"\$(stat -c %a '$DEPLOY_PATH/.env')\" = 600"
          else
            if [ -z "$PROD_ENV_FILE" ]; then
              echo "::error::Production .env is absent and PROD_ENV_FILE is not configured"
              exit 1
            fi
            printf '%s' "$PROD_ENV_FILE" | sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "umask 077; tmp_env='$DEPLOY_PATH/.env.bootstrap.\$\$'; trap 'rm -f \"\$tmp_env\"' EXIT; cat > \"\$tmp_env\"; test -s \"\$tmp_env\"; chown root:root \"\$tmp_env\"; chmod 600 \"\$tmp_env\"; mv -f \"\$tmp_env\" '$DEPLOY_PATH/.env'; trap - EXIT"
          fi
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # Delivered as a file for the same reason as .env: a command line is visible in
          # the process table, and this is only read when a certificate has to be issued.
          printf '%s' "$LETSENCRYPT_EMAIL" | sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.letsencrypt-email' && chmod 600 '$DEPLOY_PATH/.letsencrypt-email'"
      - name: Deploy, verify, and roll back on failure
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$IMAGE_TAG" "$IMAGE_PREFIX" <<'REMOTE'
          set -eu
          deploy_path="$1"
          image_tag="$2"
          image_prefix="$3"
          cd "$deploy_path"
          compose="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          services="backend frontend identity records sis"
          # Both are declared `:?required` on every service image, and compose
          # interpolates the whole file even when a single service is named — so any
          # compose call before the first release, not just the release itself, needs
          # them. release() re-exports IMAGE_TAG to roll back to a different tag.
          export REGISTRY_IMAGE_PREFIX="$image_prefix"
          export IMAGE_TAG="$image_tag"

          previous=""
          if [ -f .current-image-tag ]; then previous="$(cat .current-image-tag)"; fi
          current_env_hash="$(sha256sum .env | awk '{print $1}')"
          previous_env_hash=""
          if [ -f .current-env-sha256 ]; then previous_env_hash="$(cat .current-env-sha256)"; fi

          release() {
            export IMAGE_TAG="$1"
            $compose pull $services
            $compose up -d
          }

          healthy() {
            timeout 300 sh -c 'until wget -qO- http://127.0.0.1:8000/health >/dev/null 2>&1 && wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1; do sleep 5; done'
          }

          # Postgres applies POSTGRES_PASSWORD only while initialising an empty data
          # directory. On an estate whose postgres_data volume already exists, a rotated
          # password in .env is silently ignored: the role keeps the one it was created
          # with. The backend is the only service that speaks to postgres, so it is the
          # only one that fails — and it fails authenticating at boot while pg_isready
          # still reports the container healthy, which reads like a broken image rather
          # than a credential. Reconcile the role with what .env now says, so the file is
          # the single source of truth it is already rewritten as on every deploy.
          # PROD_ENV_FILE is commonly authored on Windows, and compose strips the CR it
          # leaves on each value. Reading the file directly does not, so without `tr` the
          # role would be set to the password plus a carriage return — matching nothing
          # the backend ever sends, and failing exactly like the mismatch this repairs.
          pg_user="$(sed -n 's/^POSTGRES_USER=//p' .env | head -1 | tr -d '\r')"
          pg_pass="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env | head -1 | tr -d '\r')"
          : "${pg_user:=postgres}"
          if [ -n "$pg_pass" ]; then
            $compose up -d postgres
            waited=0
            # `</dev/null` is load-bearing on every exec below. This script reaches the
            # server on ssh's stdin, via `bash -s`, and `compose exec -T` attaches stdin
            # and drains it — so an exec that inherits it swallows the unread remainder
            # of the script. Bash then runs only what it had buffered and exits 0 at the
            # early EOF: the release never happens and the job still reports success.
            until $compose exec -T postgres pg_isready -U "$pg_user" -q </dev/null; do
              waited=$((waited + 2))
              if [ "$waited" -gt 120 ]; then
                echo "postgres did not become ready in ${waited}s"
                exit 1
              fi
              sleep 2
            done
            # psql quotes :'pw' itself, so a password containing shell or SQL syntax is
            # carried through as data rather than parsed. It interpolates only input it
            # lexes, though — never -c, which goes to the server verbatim and fails on
            # the colon — so the statement has to arrive on stdin. Output is discarded
            # rather than logged.
            echo "ALTER USER CURRENT_USER WITH PASSWORD :'pw';" \
              | $compose exec -T postgres psql -v ON_ERROR_STOP=1 -U "$pg_user" \
                  -d postgres -v pw="$pg_pass" >/dev/null
            echo "postgres role '$pg_user' reconciled with .env"
          fi

          release "$image_tag"
          if [ "$current_env_hash" != "$previous_env_hash" ]; then
            $compose up -d --no-deps --force-recreate backend identity records sis
          fi
          $compose exec -T sis alembic -c sis/alembic.ini upgrade head </dev/null

          if healthy; then
            printf '%s' "$image_tag" > .current-image-tag
            printf '%s' "$current_env_hash" > .current-env-sha256
            if [ -n "$previous" ]; then printf '%s' "$previous" > .previous-image-tag; fi
            $compose ps
            exit 0
          fi

          echo "Health check failed for $image_tag"
          # Without this the job ends on "container is unhealthy" and the reason stays on
          # a server nobody can reach from the run. The logs are the whole diagnosis.
          echo "--- backend logs (last 100 lines) ---"
          $compose logs --no-color --tail 100 backend || true
          if [ -n "$previous" ]; then
            echo "Rolling back to $previous"
            release "$previous"
            healthy || true
          fi
          $compose ps
          exit 1
          REMOTE
      # Read-only, and deliberately before anything is installed. It reports the host
      # facts the next step depends on — which vhost already claims these names, whether
      # port 80 can answer an ACME challenge, what certificates exist — so a run that
      # cannot succeed says why before it has touched nginx at all, and the answer is in
      # this log rather than on a server someone has to open a session against.
      - name: Pre-flight the public-domain prerequisites
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_PATH/deploy/scripts/preflight-public-domains.sh' '$DEPLOY_HOST'" </dev/null
      # Runs only once the stack above is healthy, so the domains are never pointed at a
      # release that did not come up. The script is executed as a file rather than piped
      # to `bash -s`: a script delivered on stdin is eaten by anything inside it that
      # reads stdin, which is how a previous release reported success without deploying.
      - name: Configure public domains, certificates, and Nginx
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x '$DEPLOY_PATH/deploy/scripts/configure-public-domains.sh' && bash '$DEPLOY_PATH/deploy/scripts/configure-public-domains.sh' '$DEPLOY_HOST'" </dev/null
      # The VPS checked the same URLs from inside its own network. This repeats them from
      # outside it, which is the only vantage point that also proves 443 is reachable and
      # the chain verifies against a store the server does not control.
      - name: Verify public endpoints from outside the VPS
        run: |
          fail=0
          for url in \
            "https://auth.aurexis.cc/docs" \
            "https://api.aurexis.cc/docs" \
            "https://api.aurexis.cc/health" \
            "https://api.aurexis.cc/ready"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "OK  $url -> $code"
            else
              echo "::error::$url returned $code (wanted 200)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
