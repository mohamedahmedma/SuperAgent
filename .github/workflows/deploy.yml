name: Production pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/superagent
  VITE_IDENTITY_BASE_URL: https://auth.aurexis.cc

jobs:
  ci:
    name: Stage 1 - CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  changes:
    name: Stage 2 - Detect changed services
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      identity: ${{ steps.detect.outputs.identity }}
      records: ${{ steps.detect.outputs.records }}
      sis: ${{ steps.detect.outputs.sis }}
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: detect
        shell: bash
        run: |
          changed="$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA" 2>/dev/null || git ls-files)"
          all=false; backend=false; frontend=false; identity=false; records=false; sis=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/deploy.yml|docker-compose*.yml|Dockerfile|pyproject.toml|uv.lock) all=true ;;
              backend/*) backend=true ;;
              frontend/*) frontend=true ;;
              identity/*) identity=true ;;
              records/*) records=true ;;
              sis/*) sis=true ;;
              schoolauth/*) backend=true; identity=true; records=true ;;
            esac
          done <<< "$changed"
          if [ "$all" = true ]; then backend=true; frontend=true; identity=true; records=true; sis=true; fi
          services=""
          for service in backend frontend identity records sis; do
            value="${!service}"
            echo "$service=$value" >> "$GITHUB_OUTPUT"
            [ "$value" = true ] && services="$services $service"
          done
          echo "services=${services# }" >> "$GITHUB_OUTPUT"

  cd-publish-backend:
    name: CD - Publish backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:stable
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  cd-publish-frontend:
    name: CD - Publish frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:stable
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_IDENTITY_BASE_URL=${{ env.VITE_IDENTITY_BASE_URL }}

  cd-publish-identity:
    name: CD - Publish identity image
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: identity/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/identity:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/identity:stable
          cache-from: type=gha,scope=identity
          cache-to: type=gha,mode=max,scope=identity

  cd-publish-records:
    name: CD - Publish records image
    needs: changes
    if: needs.changes.outputs.records == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: records/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/records:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/records:stable
          cache-from: type=gha,scope=records
          cache-to: type=gha,mode=max,scope=records

  cd-publish-sis:
    name: CD - Publish sis image
    needs: changes
    if: needs.changes.outputs.sis == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sis/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sis:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/sis:stable
          cache-from: type=gha,scope=sis
          cache-to: type=gha,mode=max,scope=sis

  cd-release-ready:
    name: CD - All release images published
    needs:
      - changes
      - cd-publish-backend
      - cd-publish-frontend
      - cd-publish-identity
      - cd-publish-records
      - cd-publish-sis
    runs-on: ubuntu-latest
    # Each unchanged service is intentionally skipped. Opt out of GitHub's implicit
    # success() check, but still reject a failed image build or a cancelled run.
    if: >-
      ${{
        !cancelled() &&
        needs.changes.result == 'success' &&
        (needs.cd-publish-backend.result == 'success' || needs.cd-publish-backend.result == 'skipped') &&
        (needs.cd-publish-frontend.result == 'success' || needs.cd-publish-frontend.result == 'skipped') &&
        (needs.cd-publish-identity.result == 'success' || needs.cd-publish-identity.result == 'skipped') &&
        (needs.cd-publish-records.result == 'success' || needs.cd-publish-records.result == 'skipped') &&
        (needs.cd-publish-sis.result == 'success' || needs.cd-publish-sis.result == 'skipped')
      }}
    steps:
      - run: echo "All release images for ${{ github.sha }} were published successfully."

  deploy:
    name: Stage 3 - Deploy production (approval required)
    needs: [changes, cd-release-ready]
    # A skipped service job in the transitive dependency chain otherwise causes this
    # job to be skipped before GitHub can present the environment approval prompt.
    if: >-
      ${{
        !cancelled() &&
        needs.changes.result == 'success' &&
        needs.cd-release-ready.result == 'success'
      }}
    runs-on: ubuntu-latest
    # Configure `production` in GitHub Settings with both maintainers as required
    # reviewers. GitHub pauses this job here; either one may approve it.
    environment:
      name: production
    env:
      DEPLOY_HOST: 13.140.153.131
      DEPLOY_PORT: '22'
      DEPLOY_USER: root
      DEPLOY_PATH: /opt/superagent
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_SERVICES: ${{ needs.changes.outputs.services }}
      IMAGE_TAG: ${{ github.sha }}
      # Only consulted when a certificate is missing. An estate whose certificates are
      # already issued deploys without it.
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH SSHPASS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deployment configuration:$missing"
            exit 1
          fi
          case "$DEPLOY_PORT" in
            *[!0-9]*|'') echo "::error::DEPLOY_PORT must be numeric"; exit 1 ;;
          esac
      - name: Install SSH password client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Trust deployment server
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/hostkeys || true
          if ! [ -s /tmp/hostkeys ]; then
            echo "::error::No SSH host key received from $DEPLOY_HOST:$DEPLOY_PORT"
            exit 1
          fi
          cat /tmp/hostkeys >> ~/.ssh/known_hosts
      - name: Prepare server and copy Compose configuration
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          sshpass -e scp -P "$DEPLOY_PORT" docker-compose.yml docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # The public-domain configuration is repository-managed, so it ships with every
          # release and an edit made on the server does not survive one.
          sshpass -e scp -P "$DEPLOY_PORT" -r deploy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Install production environment and authenticate registry
        run: |
          # PROD_ENV_FILE bootstraps a new estate only. Once present, the server's
          # operator-validated .env is persistent state and must survive deployments.
          if sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/.env'"; then
            sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "chown root:root '$DEPLOY_PATH/.env' && chmod 600 '$DEPLOY_PATH/.env' && test \"\$(stat -c %a '$DEPLOY_PATH/.env')\" = 600"
          else
            if [ -z "$PROD_ENV_FILE" ]; then
              echo "::error::Production .env is absent and PROD_ENV_FILE is not configured"
              exit 1
            fi
            printf '%s' "$PROD_ENV_FILE" | sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "umask 077; tmp_env='$DEPLOY_PATH/.env.bootstrap.\$\$'; trap 'rm -f \"\$tmp_env\"' EXIT; cat > \"\$tmp_env\"; test -s \"\$tmp_env\"; chown root:root \"\$tmp_env\"; chmod 600 \"\$tmp_env\"; mv -f \"\$tmp_env\" '$DEPLOY_PATH/.env'; trap - EXIT"
          fi
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # Delivered as a file for the same reason as .env: a command line is visible in
          # the process table, and this is only read when a certificate has to be issued.
          printf '%s' "$LETSENCRYPT_EMAIL" | sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.letsencrypt-email' && chmod 600 '$DEPLOY_PATH/.letsencrypt-email'"
      - name: Deploy, verify, and roll back on failure
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$IMAGE_TAG" "$IMAGE_PREFIX" "$DEPLOY_SERVICES" <<'REMOTE'
          set -eu
          deploy_path="$1"
          image_tag="$2"
          image_prefix="$3"
          # ssh rebuilds the remote command as a string, so a quoted empty final
          # argument is not preserved. Accept a missing $4 for a no-service release.
          services="${4-}"
          cd "$deploy_path"
          # A documentation-only change has no application image to release.
          [ -n "$services" ] || exit 0
          tags_file=".release-image-tags"
          if [ ! -f "$tags_file" ]; then
            printf '%s\n' BACKEND_IMAGE_TAG=stable FRONTEND_IMAGE_TAG=stable IDENTITY_IMAGE_TAG=stable RECORDS_IMAGE_TAG=stable SIS_IMAGE_TAG=stable > "$tags_file"
          fi
          cp "$tags_file" "${tags_file}.previous"
          for service in $services; do
            key="$(printf '%s' "$service" | tr '[:lower:]' '[:upper:]')_IMAGE_TAG"
            sed -i "/^${key}=/d" "$tags_file"
            printf '%s=%s\n' "$key" "$image_tag" >> "$tags_file"
          done
          compose="docker compose --env-file .env --env-file $tags_file -f docker-compose.yml -f docker-compose.prod.yml"
          # Compose interpolates every service even when only one is named, so every
          # service tag is persisted in the release manifest before it is invoked.
          export REGISTRY_IMAGE_PREFIX="$image_prefix"

          previous=""
          if [ -f .current-image-tag ]; then previous="$(cat .current-image-tag)"; fi
          current_env_hash="$(sha256sum .env | awk '{print $1}')"
          previous_env_hash=""
          if [ -f .current-env-sha256 ]; then previous_env_hash="$(cat .current-env-sha256)"; fi

          release() {
            $compose pull $services || return 1
            $compose up -d --no-deps $services || return 1
          }

          healthy() {
            timeout 300 sh -c 'until wget -qO- http://127.0.0.1:8000/health >/dev/null 2>&1 && wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1; do sleep 5; done'
          }

          # Reconcile the postgres role with .env, and prove the credential authenticates
          # over TCP, before the release recreates anything.
          #
          # This used to be forty lines inline here, and that placement was the bug. A
          # heredoc delivered on ssh's stdin is unreachable from an ssh session, so the
          # only path that knew POSTGRES_PASSWORD needs reconciling was the pipeline —
          # and on 2026-09-10 the estate was taken down by a manual `scp .env` followed
          # by `compose up`, a route with no reconcile step at all. One committed script,
          # both callers, so the manual route cannot skip what this one does.
          #
          # `</dev/null` is load-bearing. This script reaches the server on ssh's stdin
          # via `bash -s`, and `compose exec -T` inside the callee attaches stdin and
          # drains it — so a call that inherits it swallows the unread remainder of this
          # script. Bash then runs only what it had buffered and exits 0 at the early
          # EOF: the release never happens and the job still reports success.
          bash deploy/scripts/apply-env.sh --path "$deploy_path" </dev/null || exit 1

          # Everything that has to hold for a release to count, behind one status. It is
          # called as an `if` condition, which is the point: `set -e` is suspended for the
          # whole call tree of a command being tested, so a step that fails returns here
          # instead of killing the script. Without that, `compose up` exiting on "container
          # is unhealthy" ended the run before the diagnosis below — which is exactly how a
          # failed deploy reported an unhealthy container and not one line of its log.
          attempt() {
            release || return 1
            # A change to .env reaches nothing on its own: compose hashes a service's own
            # configuration to decide what to recreate, and the CONTENTS of an env_file are
            # not part of that hash, so an edited file sits unread behind containers that
            # compose considers up to date. --no-deps holds the recreate to the application
            # services; the data services were brought up and waited on by the release.
            if [ "$current_env_hash" != "$previous_env_hash" ]; then
              $compose up -d --no-deps --force-recreate $services || return 1
            fi
            healthy || return 1
            # sis runs `alembic upgrade head` in its own entrypoint, so a sis that is
            # healthy has already migrated. This covers the release where sis was not
            # recreated at all, and it runs after the health gate rather than before it so
            # it cannot race a container that is still coming up.
            $compose exec -T sis alembic -c sis/alembic.ini upgrade head </dev/null || return 1
          }

          if attempt "$image_tag"; then
            printf '%s' "$image_tag" > .current-image-tag
            printf '%s' "$current_env_hash" > .current-env-sha256
            if [ -n "$previous" ]; then printf '%s' "$previous" > .previous-image-tag; fi
            $compose ps
            exit 0
          fi

          echo "Release failed for $image_tag"
          # Without this the job ends on "container is unhealthy" and the reason stays on
          # a server nobody can reach from the run. The logs are the whole diagnosis, and
          # which service is at fault is not known here — backend is the usual answer
          # because it is the only one that speaks to postgres, but a release that fails
          # for another reason should not have to be re-run to say so.
          $compose ps || true
          for service in $services; do
            echo "--- $service logs (last 100 lines) ---"
            $compose logs --no-color --tail 100 "$service" || true
          done
          if [ -f "${tags_file}.previous" ]; then
            echo "Rolling back the changed service tags"
            mv -f "${tags_file}.previous" "$tags_file"
            release || true
            healthy || true
          fi
          $compose ps
          exit 1
          REMOTE
      # Read-only, and deliberately before anything is installed. It reports the host
      # facts the next step depends on — which vhost already claims these names, whether
      # port 80 can answer an ACME challenge, what certificates exist — so a run that
      # cannot succeed says why before it has touched nginx at all, and the answer is in
      # this log rather than on a server someone has to open a session against.
      - name: Pre-flight the public-domain prerequisites
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_PATH/deploy/scripts/preflight-public-domains.sh' '$DEPLOY_HOST'" </dev/null
      # Runs only once the stack above is healthy, so the domains are never pointed at a
      # release that did not come up. The script is executed as a file rather than piped
      # to `bash -s`: a script delivered on stdin is eaten by anything inside it that
      # reads stdin, which is how a previous release reported success without deploying.
      - name: Configure public domains, certificates, and Nginx
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x '$DEPLOY_PATH/deploy/scripts/configure-public-domains.sh' && bash '$DEPLOY_PATH/deploy/scripts/configure-public-domains.sh' '$DEPLOY_HOST'" </dev/null
      # The VPS checked the same URLs from inside its own network. This repeats them from
      # outside it, which is the only vantage point that also proves 443 is reachable and
      # the chain verifies against a store the server does not control.
      - name: Verify public endpoints from outside the VPS
        run: |
          fail=0
          for url in \
            "https://auth.aurexis.cc/docs" \
            "https://api.aurexis.cc/docs" \
            "https://api.aurexis.cc/health" \
            "https://api.aurexis.cc/ready"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "OK  $url -> $code"
            else
              echo "::error::$url returned $code (wanted 200)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
