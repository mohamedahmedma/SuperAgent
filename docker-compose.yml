name: superagent

x-app-common: &app-common
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  networks: [app, data]

services:
  postgres:
    image: postgres:15.8-alpine
    container_name: superagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langchain_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langchain_app}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7.4.1-alpine
    container_name: superagent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: superagent-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes: [etcd_data:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [data]

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: superagent-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes: [minio_data:/minio_data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [data]

  standalone:
    image: milvusdb/milvus:v2.5.14
    container_name: superagent-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt: [seccomp:unconfined]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_HOST_PORT:-9091}:9091"
    volumes: [milvus_data:/var/lib/milvus]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    networks: [data]

  attu:
    image: zilliz/attu:v2.5.11
    container_name: superagent-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: standalone:19530
      PORT: "3000"
    ports: ["127.0.0.1:${ATTU_HOST_PORT:-8081}:3000"]
    depends_on:
      standalone: {condition: service_healthy}
    networks: [data]

  sis:
    <<: *app-common
    build:
      context: .
      dockerfile: sis/Dockerfile
    image: superagent/sis:${IMAGE_TAG:-local}
    container_name: superagent-sis
    environment:
      SIS_DATABASE_URL: sqlite:////app/data/sis.db
      SIS_BOOTSTRAP_REGISTRAR_KEY: ${LOCAL_SERVICE_KEY}
    ports: ["127.0.0.1:${SIS_HOST_PORT:-8300}:8300"]
    volumes: [sis_data:/app/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  identity:
    <<: *app-common
    build:
      context: .
      dockerfile: identity/Dockerfile
    image: superagent/identity:${IMAGE_TAG:-local}
    container_name: superagent-identity
    environment:
      IDENTITY_DATABASE_URL: sqlite:////app/data/identity.db
      IDENTITY_DEV_KEY_FILE: /app/data/identity-dev-key.pem
      IDENTITY_SIS_BASE_URL: http://sis:8300
      IDENTITY_SIS_API_KEY: ${LOCAL_SERVICE_KEY}
      IDENTITY_ADMIN_KEY: ${LOCAL_SERVICE_KEY}
    ports: ["127.0.0.1:${IDENTITY_HOST_PORT:-8200}:8200"]
    volumes: [identity_data:/app/data]
    depends_on:
      sis: {condition: service_healthy}

  records:
    <<: *app-common
    build:
      context: .
      dockerfile: records/Dockerfile
    image: superagent/records:${IMAGE_TAG:-local}
    container_name: superagent-records
    environment:
      RECORDS_API_KEY: ${LOCAL_SERVICE_KEY}
      RECORDS_LMS: sis
      SIS_BASE_URL: http://sis:8300
      SIS_API_KEY: ${LOCAL_SERVICE_KEY}
      IDENTITY_JWKS_URL: http://identity:8200/.well-known/jwks.json
    ports: ["127.0.0.1:${RECORDS_HOST_PORT:-8100}:8100"]
    depends_on:
      sis: {condition: service_healthy}
      identity: {condition: service_healthy}

  backend:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
    image: superagent/backend:${IMAGE_TAG:-local}
    container_name: superagent-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-langchain_app}
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: standalone
      MILVUS_PORT: "19530"
      RECORDS_BASE_URL: http://records:8100
      RECORDS_API_KEY: ${LOCAL_SERVICE_KEY}
      IDENTITY_BASE_URL: http://identity:8200
      IDENTITY_JWKS_URL: http://identity:8200/.well-known/jwks.json
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Without this the local embedding model downloads into the container's
      # ephemeral layer and is re-fetched on every recreate. Pointing it at a named
      # volume makes that a one-time cost.
      HF_HOME: /app/hf-cache
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"]
    volumes:
      - backend_data:/app/data
      - uploads_data:/app/uploads
      - hf_cache:/app/hf-cache
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      standalone: {condition: service_healthy}
      records: {condition: service_healthy}
      identity: {condition: service_healthy}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_IDENTITY_BASE_URL: ${VITE_IDENTITY_BASE_URL:-}
    image: superagent/frontend:${IMAGE_TAG:-local}
    container_name: superagent-frontend
    restart: unless-stopped
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"]
    depends_on:
      backend: {condition: service_healthy}
      identity: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [app]

networks:
  app:
    name: superagent-app
  data:
    name: superagent-data

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  identity_data:
  sis_data:
  backend_data:
  uploads_data:
  hf_cache:
