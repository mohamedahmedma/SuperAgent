# superagent.aurexis.cc -> the chat UI on 127.0.0.1:3000, and SIS on 127.0.0.1:8300.
#
# Repository-managed. Installed by deploy/scripts/configure-public-domains.sh on every
# deployment, so an edit made on the server is overwritten by the next release: change it
# here.
#
# This host was configured by hand, and by certbot's nginx plugin, until 2026-09-12. It
# came into the repository because it is the hop an admin's knowledge-base upload actually
# meets — the frontend image is built without VITE_API_BASE_URL, so the bundle posts
# /documents to its own origin rather than to api.aurexis.cc — and it carried nginx's 1m
# default. A 2 MB PDF was refused here with a 413 that named no service, while the two
# vhosts the repository already managed were correct and untouched by the problem.
#
# It is NOT only the chat UI. Five locations answer from SIS, and they are reproduced from
# the hand-written file verbatim: taking this vhost over means owning the registrar
# console's public routing too, and a rewrite that dropped /ui/ or /health would pass
# `nginx -t` and take the console down silently.

server {
    listen 80;
    listen [::]:80;
    server_name superagent.aurexis.cc;

    # Certbot renews over port 80 long after TLS is live, so this has to keep answering
    # here and not be swallowed by the redirect below. `^~` stops nginx considering any
    # regex location for this prefix.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name superagent.aurexis.cc;

    ssl_certificate     /etc/letsencrypt/live/superagent.aurexis.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/superagent.aurexis.cc/privkey.pem;

    # Stated here rather than included from /etc/letsencrypt/options-ssl-nginx.conf, which
    # is what the hand-written file did. That file ships with certbot's nginx plugin, and a
    # missing include fails `nginx -t` outright — so depending on it makes this vhost
    # unloadable on any host that installed certbot without the plugin. The two vhosts this
    # script already owned state their TLS the same way, for the same reason.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Knowledge-base uploads reach the backend THROUGH this host and the frontend
    # container, so this is the first of two ceilings they meet and the lower one decides.
    # Keep it in step with frontend/nginx.conf and deploy/nginx/api.aurexis.cc.conf;
    # tests/general/test_upload_size_limits.py fails if they drift.
    #
    # Server level, so the SIS locations get it too. SIS caps its own imports at
    # SIS_MAX_UPLOAD_BYTES (5 MB by default) and answers an oversized one with a typed
    # `upload_too_large` JSON error, which is a far better diagnosis than nginx's bare
    # page — and at the 1m default this vhost used to apply, a 2 MB roster import was
    # refused here before SIS could produce it.
    client_max_body_size 512m;

    # The gap allowed BETWEEN successive reads of the body, not a budget for the whole
    # upload. The default 60s is therefore not a size limit, but it does end an upload that
    # stalls partway through on a weak connection.
    client_body_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ======================================================================================
    # SIS — reproduced from the hand-written vhost. `proxy_pass` without a trailing path
    # passes the request URI through unchanged; the three exact-match locations name the
    # path explicitly, exactly as they did before.
    # ======================================================================================

    location /v1/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8300/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8300/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8300/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ui/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # ======================================================================================
    # The chat UI, and every API call the bundle makes to its own origin.
    # ======================================================================================

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Stream the body onward instead of spooling it here first. With the default (on),
        # nginx writes the whole upload to this host's disk before opening a connection to
        # the frontend container, which then buffers it again — half a gigabyte written
        # twice before the backend sees a byte.
        proxy_request_buffering off;

        # The response only comes once the backend has written the upload to disk, which
        # for a large document outlasts the default 60s.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
