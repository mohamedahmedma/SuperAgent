# auth.aurexis.cc -> the identity service on 127.0.0.1:8200.
#
# Repository-managed. Installed by deploy/scripts/configure-public-domains.sh on every
# deployment, so an edit made on the server is overwritten by the next release: change it
# here. Identity is published on loopback only (docker-compose.yml), and this file is the
# sole path from the internet to it.
#
# Note that identity answers `/` with {"detail":{"code":"not_found",...}}. That is the
# application's own routing, not a proxy fault, which is why the availability check for
# this host is /docs.

upstream superagent_identity {
    server 127.0.0.1:8200;
    # Reuse upstream connections. Paired with `proxy_set_header Connection ""` below,
    # which is what actually lets HTTP/1.1 keepalive apply to a proxied request.
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.aurexis.cc;

    # Certbot renews over port 80 long after TLS is live, so this has to keep answering
    # here and not be swallowed by the redirect below. `^~` stops nginx considering any
    # regex location for this prefix.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.aurexis.cc;

    ssl_certificate     /etc/letsencrypt/live/auth.aurexis.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.aurexis.cc/privkey.pem;

    # Stated here rather than included from /etc/letsencrypt/options-ssl-nginx.conf: that
    # file ships with certbot's nginx plugin, which a webroot-only install does not need,
    # and a missing include fails `nginx -t` outright.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Sign-in payloads are small; this is a ceiling, not a target.
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # No trailing slash on proxy_pass and no rewrite: the request URI reaches the app
    # exactly as it arrived, so /v1/... and /docs and /.well-known/jwks.json all keep the
    # paths the service actually publishes.
    location / {
        proxy_pass http://superagent_identity;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
