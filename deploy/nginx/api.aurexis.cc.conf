# api.aurexis.cc -> the chat backend on 127.0.0.1:8000.
#
# Repository-managed. Installed by deploy/scripts/configure-public-domains.sh on every
# deployment, so an edit made on the server is overwritten by the next release: change it
# here. The backend is published on loopback only (docker-compose.yml), and this file is
# the sole path from the internet to it.

upstream superagent_backend {
    server 127.0.0.1:8000;
    # Reuse upstream connections. Paired with `proxy_set_header Connection ""` below,
    # which is what actually lets HTTP/1.1 keepalive apply to a proxied request.
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aurexis.cc;

    # Certbot renews over port 80 long after TLS is live, so this has to keep answering
    # here and not be swallowed by the redirect below. `^~` stops nginx considering any
    # regex location for this prefix.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aurexis.cc;

    ssl_certificate     /etc/letsencrypt/live/api.aurexis.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aurexis.cc/privkey.pem;

    # Stated here rather than included from /etc/letsencrypt/options-ssl-nginx.conf: that
    # file ships with certbot's nginx plugin, which a webroot-only install does not need,
    # and a missing include fails `nginx -t` outright.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Document uploads go through this host. The ceiling is the knowledge base's, not
    # the chat API's: a KB document is occasionally a scanned manual of several hundred
    # megabytes, and nginx refuses anything larger with a 413 the application never sees
    # and therefore cannot explain. Keep this in step with frontend/nginx.conf — an admin
    # reaches the backend through one or the other depending on whether the build baked in
    # VITE_API_BASE_URL, and the lower of the two is the one that decides.
    client_max_body_size 512m;

    # The gap allowed BETWEEN successive reads of the body, not a budget for the whole
    # upload. The default 60s is therefore not a size limit, but it does end an upload
    # that stalls on a weak connection partway through.
    client_body_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Server-sent events. Buffering here would hold the whole answer until the stream
    # closed, which reads downstream as a backend that never replies, and the read timeout
    # has to outlast a long generation rather than the default 60s.
    location /chat/stream {
        proxy_pass http://superagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # No trailing slash on proxy_pass and no rewrite: the request URI reaches the app
    # exactly as it arrived. /chat, /sessions, /documents, /media/resolve, /health, /ready
    # and /docs are all served from the application root, and adding a prefix here would
    # 404 every one of them.
    location / {
        proxy_pass http://superagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;

        # Stream the request body upstream rather than spooling the whole upload to this
        # host's disk before the backend is contacted. Without it a 512 MB document is
        # written to /var/lib/nginx once on the way in, and the browser's progress bar
        # completes long before the backend has seen a byte.
        proxy_request_buffering off;

        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
