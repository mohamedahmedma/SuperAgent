# School assistant — answers parents about the school, and about their own child.
#
# The only profile that binds `get_student_records`, and deliberately so. Every bound
# tool ships its name, description and argument schema to the model on every single
# call — that is where the cost sits, not in the system prompt, which varies only by
# whether any bound tool is grounded. Adding student records to `base` would bill every
# deployment (a document knowledge base, an e-commerce catalogue) on every turn for a
# capability it can never serve, and would offer the model a tool it will occasionally
# try to call.
#
# Activate with ACTIVE_PROFILE=school. Nothing else changes by adding this file.
#
# Reading records additionally requires the caller to be a signed-in parent whose
# account an administrator has bound to a guardian. Binding the tool grants nothing on
# its own: the identity service issues the claim, and the records facade decides what
# it authorises. See records/README.md.

extends: base
name: school

identity:
  name: "School Assistant"
  display_name: "مساعد المدرسة"
  api_title: "School Assistant API"
  description: "Answers parents about school information and their own child's records"
  # persona lives in prompts/templates/packs/school/persona.j2 — see the `agent` section
  # below for why prompt text left this file. Setting `persona:` here still overrides
  # the pack, for a deployment that would rather keep its voice in one YAML.
  redis_key_prefix: "school"
  langsmith_project: "school-assistant"

agent:
  # Lists replace rather than merge, so this list is the whole set, not an addition
  # to base's.
  #
  # `get_student_records` covers grades, subject breakdowns and attendance in one tool
  # rather than three. The model chooses between them with a `record_type` argument, so
  # the prompt carries one tool description instead of three near-identical ones, and a
  # parent asking about two children in one turn stays inside a single budget.
  tools:
    - search_knowledge_base
    - get_student_records

  # PROMPT TEXT LIVES IN prompts/templates/packs/school/, not here.
  #
  # A profile answers "what is this deployment"; a prompt answers "how does the system
  # talk". Only the first is something a domain owner should have to write, and mixing
  # them cost real money once: a worked example carrying a real grade and a real fee was
  # reproduced verbatim by the model — as its answer, and as its search query — on
  # accounts with no child on file. Prose that the model reads is now versioned as
  # templates, where the tests that render every prompt can see it.
  #
  #   identity.persona     -> packs/school/persona.j2
  #   system_prompt        -> packs/school/system.j2
  #   arabic_style_prompt  -> packs/school/arabic_style.j2
  #
  # Each is loaded at profile load by registry._apply_prompt_packs. Setting any of them
  # here still wins, so a deployment can pin a prompt in YAML without moving the file.
  #
  # Register belongs in `system_prompt`/`arabic_style_prompt` rather than in
  # `identity.persona` because persona is ALSO rendered into five classifier prompts
  # (request_envelope, resolve_question, scope_check, section_summary, corpus_digest).
  # Style examples there would be billed on every classifier call and shown to a node
  # explicitly told it never talks to the user.
  #
  # BUDGETED AT 500 TOKENS rendered, enforced by test_prompt_budget.py. It is paid on
  # every single turn, and Arabic costs roughly three tokens a word on this tokenizer.

  # A school serves parents who write Arabic or English and nobody else, so both can be
  # named outright. The global map names only Arabic, on the grounds that `en` is what
  # the detector returns for anything it could not place — true in general, not true
  # here. Measured: with the vague "Reply in the language the user wrote in", 3 of 4
  # English questions came back in Arabic, because the persona mentions Arabic and
  # everything around the turn is Arabic-first.
  language_names:
    ar: Arabic
    en: English

  # arabic_style_prompt -> packs/school/arabic_style.j2. Appended only when the turn is
  # answered in ARABIC: an English turn renders none of it — 203 tokens instead of 459.

  # Replaces base's list rather than adding to it, so this is the whole set.
  #
  # Matched whole-message after normalisation, and every phrase here is one model call
  # that never happens. Base ships MSA only, so «إزيك» and «متشكر» — two of the
  # commonest Egyptian openers — fell through to the classifier.
  social_phrases:
    - hi
    - hello
    - hey
    - good morning
    - good evening
    - thanks
    - thank you
    - ok
    - okay
    - bye
    - goodbye
    - مرحبا
    - اهلا
    - أهلا
    - اهلا وسهلا
    - السلام عليكم
    - صباح الخير
    - مساء الخير
    - شكرا
    - شكرا لك
    - شكرا جزيلا
    - تمام
    - حسنا
    - طيب
    - مع السلامة
    - ازيك
    - إزيك
    - ازيك يا فندم
    - عامل ايه
    - عاملة ايه
    - صباح الفل
    - مساء الفل
    - متشكر
    - متشكرة
    - الف شكر
    - ألف شكر
    - ماشي
    - تسلم
    - ربنا يخليك
    - تحت أمرك
    - سلام
    - باي

  # A school assistant is asked plenty that the corpus is not about — homework help,
  # general knowledge, chat. Without this the catalogue rung can only admit, so those
  # reach the agent and get answered on general knowledge in the school's voice.
  #
  # This profile ships no scope catalogue, so the classifier node judges against
  # `coverage` below rather than against indexed questions and similarity scores.
  request_envelope_enabled: true

  # What the classifier compares a message against. Load-bearing on this profile and
  # nowhere else: with a catalogue the node is shown real questions the corpus is known
  # to answer, and this description is a poor substitute for that. Without one it is
  # the only thing standing between the classifier and a guess — an empty string here
  # is how an assistant starts refusing valid questions for want of anything to compare
  # them to.
  #
  # Written as prose rather than a topic list because the node has to judge messages
  # phrased in words nobody listed, in either language.
  #
  # Bilingual because this is the ONLY surface an Arabic message is compared against on
  # this profile (it ships no scope catalogue), and Arabic is the primary language here.
  # With English-only prose, every Arabic turn asked a small model to judge scope across
  # a translation gap — and the two mistakes do not cost the same: a wrong
  # `out_of_domain` refuses a parent outright, while a wrong `in_domain` spends one
  # search nobody sees. The Arabic half is written in the words parents actually type,
  # Egyptian included, so the comparison is lexical rather than a translation.
  coverage: >-
    Everything a parent or guardian asks a school: term dates, holidays and the
    calendar; fees, payment plans and discounts; admissions and registration; uniform,
    books and equipment; transport and bus routes; the school day, timetables and
    lateness; attendance and absence rules; exams, results and report cards; subjects
    and curriculum; trips and activities; medical, dietary and allergy policy; contact
    details and how to reach a teacher or the office. It also answers questions about a
    specific child's own marks, attendance and report card, for the parent signed in as
    that child's guardian.
    نفس المواضيع بالعربي، بالكلمات اللي أولياء الأمور بيستخدموها فعلاً: المصاريف
    والمصروفات والرسوم والأقساط والخصومات؛ التقديم والتسجيل والقبول؛ مواعيد الترم
    والفصل الدراسي والإجازات والنتيجة وشهادة الدرجات؛ الزي المدرسي واليونيفورم والكتب
    والأدوات؛ الباص والأتوبيس والاشتراك والمواصلات؛ جدول الحصص واليوم الدراسي والحضور
    والغياب والتأخير؛ الامتحانات والدرجات والمواد والمناهج؛ الرحلات والأنشطة؛ الحالة
    الصحية والحساسية والأكل؛ أرقام التواصل ومقابلة المدرسين ومكتب المدرسة؛ وكمان أسئلة
    ولي الأمر عن درجات وغياب وجدول ابنه أو بنته هو شخصياً.

  # Reported by the classifier when a message discloses one, and used to decide whether
  # a post-turn profile capture is worth paying for. A closed list, because free text
  # here would make the node an extractor — a different and far harder job.
  personal_data_fields:
    - child_name
    - year_group
    - phone
    - email
    - preferred_language

  # This deployment has children to talk about, so the classifier is asked whether a
  # message is about one. Deployment data, not identity: it says nothing about who is
  # asking, which is why a detector is allowed to read it.
  child_context_enabled: true

  # Two knowledge calls, because a parent question often has a policy half and a
  # records half ("is she allowed to miss Thursday, and how many days has she
  # missed?"). The records tool has its own separate budget — see
  # ChatRequestContext.acquire_records_tool_slot.
  max_knowledge_calls_per_turn: 2

  # A fee, an instalment, a deadline — the figures in this corpus are what a parent acts
  # on, so a figure that is in no retrieved chunk must not be served. Enforced rather
  # than observed because the failure this closes actually reached a parent: an invented
  # «45 ألف» for a grade the child is not in. See backend/chat/grounding.py.
  answer_grounding_mode: enforce

  # Six turns of conversation, which is TWELVE messages — this is counted in messages,
  # not exchanges, and setting it to 6 would give a parent three turns of memory.
  #
  # Six is chosen rather than inherited because this is the profile where the history
  # window does real work: it is what lets the model follow "and what about his
  # timetable?" back to the child settled two turns ago, without anything having to
  # detect the Arabic enclitic possessive that question takes. The durable pin
  # (backend/chat/child_context.py) is the mechanism; this window is what makes the
  # model's own reading of the conversation agree with it.
  context_window_messages: 12

models:
  # 0.3 on a 20B model code-switches and drifts grammatically more in Arabic than in
  # English, and this domain wants fees and dates stated the same way twice rather than
  # varied. The other roles are already deterministic.
  answer_temperature: 0.2

# Everything the system says WITHOUT a model composing it.
#
# `out_of_domain` and `social` are the only two the schema carries per-language; the
# rest are single strings, so on an Arabic-first deployment they are written in Arabic.
# That is a deliberate trade: an English-writing parent gets Arabic on these paths,
# which is the right way round when Arabic is primary and these are the moments the
# assistant is least helpful anyway. The two localized fields still switch correctly.
#
# Register matches agent.system_prompt above — these sit next to model-written replies
# in the same conversation, and base's MSA boilerplate reads as a different assistant.
user_copy:
  out_of_domain:
    en: >-
      That's outside what I can help with here — I answer questions about the school.
      Ask me about those and I'll do my best.
    ar: >-
      ده خارج اللي أقدر أساعد فيه هنا — أنا بجاوب على أسئلة المدرسة زي المصاريف
      والمواعيد والغياب ودرجات ابنك. اسألني في حاجة من دول وأنا تحت أمرك.
  social:
    en: "Happy to help — what would you like to know?"
    ar: "أهلاً بحضرتك، تحت أمرك — عايز تعرف إيه؟"
  no_knowledge: >-
    المعلومة دي مش موجودة في مصادر المدرسة اللي عندي دلوقتي، ومش عايز أقولك حاجة
    مش متأكد منها. أنصح حضرتك تتواصل مع مكتب المدرسة.
  retrieval_error: >-
    في مشكلة تقنية مؤقتة منعتني أوصل لمصادر المدرسة. ممكن حضرتك تجرّب تاني بعد شوية؟
  unverified_answer: >-
    معلش، مقدرتش أتأكد من الأرقام دي من مستندات المدرسة نفسها، ومش عايز أقول لحضرتك رقم
    غلط في حاجة زي المصاريف. الأفضل تتواصل مع مكتب المدرسة عشان الرقم الأكيد.
  hitl_clarify_default: >-
    لقيت محتوى قريب من سؤالك، بس المعلومات مش كفاية أحدد إجابة أكيدة. ممكن حضرتك
    تديني تفاصيل أكتر؟
  hitl_clarify_missing_slots: "لقيت محتوى قريب، بس ناقصني: "
  hitl_scope_default: "لقيت أكتر من موضوع ممكن يكون ده اللي حضرتك بتسأل عنه. أنهي واحد فيهم؟"
  hitl_clarify_agent: >-
    لقيت المعلومة تقريباً، بس ناقصني تفصيلة واحدة عشان أكمّل. ممكن حضرتك توضحهالي؟
  hitl_scope_agent: "لقيت أكتر من قسم ممكن يكون فيه إجابة سؤالك. تحب أدوّر في أنهي واحد؟"
  new_session_title: "محادثة جديدة"
  unsupported_file_type: "الملفات المدعومة هي PDF و Word و Excel و HTML بس"

assets:
  figures:
    # Turns off the qwen3 scratchpad on the vision model this deployment runs
    # (VISION_MODEL=qwen/qwen3.6-27b on Groq). Ingest sends one vision call per image
    # and the scratchpad is reserved against the tokens-per-minute quota before any
    # answer is written, so on a small quota this reclaims more room than raising
    # vision_max_output_tokens can.
    #
    # It has to go here rather than in `vision_reasoning_effort`, and rather than in
    # VISION_REASONING_EFFORT: that field's validator folds "none" to "", which means
    # SEND NO reasoning parameter — leaving the model's own default (reasoning on).
    # Only extra_params can put the literal string on the wire. See
    # FigurePipelineConfig._validate_vision_effort, and supermew.yaml, which carries
    # this same block for the same model.
    vision_extra_params:
      reasoning_effort: none

retrieval:
  # School corpora are small and repetitive — fee tables, calendars, policy pages
  # restated per year group — so recall matters more than precision here.
  top_k: 8
  candidate_k: 30
