# School assistant — answers parents about the school, and about their own child.
#
# The only profile that binds the student-record tools, and deliberately so. Every bound
# tool ships its name, description and argument schema to the model on every single
# call — that is where the cost sits, not in the system prompt, which varies only by
# whether any bound tool is grounded. Adding student records to `base` would bill every
# deployment (a document knowledge base, an e-commerce catalogue) on every turn for a
# capability it can never serve, and would offer the model a tool it will occasionally
# try to call.
#
# Activate with ACTIVE_PROFILE=school. Nothing else changes by adding this file.
#
# Reading records additionally requires the caller to be a signed-in parent whose
# account an administrator has bound to a guardian. Binding the tool grants nothing on
# its own: the identity service issues the claim, and the records facade decides what
# it authorises. See records/README.md.

extends: base
name: school

identity:
  name: "School Assistant"
  display_name: "مساعد المدرسة"
  api_title: "School Assistant API"
  description: "Answers parents about school information and their own child's records"
  # persona lives in prompts/templates/packs/school/persona.j2 — see the `agent` section
  # below for why prompt text left this file. Setting `persona:` here still overrides
  # the pack, for a deployment that would rather keep its voice in one YAML.
  redis_key_prefix: "school"
  langsmith_project: "school-assistant"

agent:
  # Lists replace rather than merge, so this list is the whole set, not an addition
  # to base's.
  #
  # ONE TOOL PER RECORD, not one tool with a `record_type` argument. The planner selects
  # tools by NAME, so a capability reachable only through an argument is one the planner
  # cannot ask for — it had to guess `grades` and let the model spend a round trip
  # correcting it. Split, a question about absences AND marks dispatches both at once,
  # which the merged shape could not express at all.
  #
  # The cost is four tool schemas on the wire every turn instead of one. Paid knowingly:
  # the round trip it removes is worth more than the schemas it adds, and the audited-read
  # ceiling is shared across all of them, so splitting did not multiply it.
  tools:
    - search_knowledge_base
    - get_student_grades
    - get_subject_grades
    - get_student_attendance
    - get_student_timetable
    - get_student_class
    - get_student_subjects
    - get_student_teachers
    - get_subject_teacher

  # PROMPT TEXT LIVES IN prompts/templates/packs/school/, not here.
  #
  # A profile answers "what is this deployment"; a prompt answers "how does the system
  # talk". Only the first is something a domain owner should have to write, and mixing
  # them cost real money once: a worked example carrying a real grade and a real fee was
  # reproduced verbatim by the model — as its answer, and as its search query — on
  # accounts with no child on file. Prose that the model reads is now versioned as
  # templates, where the tests that render every prompt can see it.
  #
  #   identity.persona     -> packs/school/persona.j2
  #   system_prompt        -> packs/school/system.j2
  #   arabic_style_prompt  -> packs/school/arabic_style.j2
  #
  # Each is loaded at profile load by registry._apply_prompt_packs. Setting any of them
  # here still wins, so a deployment can pin a prompt in YAML without moving the file.
  #
  # Register belongs in `system_prompt`/`arabic_style_prompt` rather than in
  # `identity.persona` because persona is ALSO rendered into five classifier prompts
  # (request_envelope, resolve_question, scope_check, section_summary, corpus_digest).
  # Style examples there would be billed on every classifier call and shown to a node
  # explicitly told it never talks to the user.
  #
  # BUDGETED AT 500 TOKENS rendered, enforced by test_prompt_budget.py. It is paid on
  # every single turn, and Arabic costs roughly three tokens a word on this tokenizer.

  # A school serves parents who write Arabic or English and nobody else, so both can be
  # named outright. The global map names only Arabic, on the grounds that `en` is what
  # the detector returns for anything it could not place — true in general, not true
  # here. Measured: with the vague "Reply in the language the user wrote in", 3 of 4
  # English questions came back in Arabic, because the persona mentions Arabic and
  # everything around the turn is Arabic-first.
  language_names:
    ar: Arabic
    en: English

  # arabic_style_prompt -> packs/school/arabic_style.j2. Appended only when the turn is
  # answered in ARABIC: an English turn renders none of it — 203 tokens instead of 459.

  # Replaces base's list rather than adding to it, so this is the whole set.
  #
  # Matched whole-message after normalisation, and every phrase here is one model call
  # that never happens. Base ships MSA only, so «إزيك» and «متشكر» — two of the
  # commonest Egyptian openers — fell through to the classifier.
  #
  # Static on this production-facing profile because the reply is already known. A
  # greeting or acknowledgement must not depend on provider tool-call compliance, and
  # paying a model call here only adds a failure mode to fixed copy the profile carries.
  social_reply_mode: static
  social_phrases:
    - hi
    - hello
    - hey
    - good morning
    - good evening
    - thanks
    - thank you
    - ok
    - okay
    - bye
    - goodbye
    - مرحبا
    - اهلا
    - أهلا
    - اهلا وسهلا
    - السلام عليكم
    - صباح الخير
    - مساء الخير
    - شكرا
    - شكرا لك
    - شكرا جزيلا
    - تمام
    - حسنا
    - طيب
    - مع السلامة
    - ازيك
    - إزيك
    - ازيك يا فندم
    - عامل ايه
    - عاملة ايه
    - صباح الفل
    - مساء الفل
    - متشكر
    - متشكرة
    - الف شكر
    - ألف شكر
    - ماشي
    - تسلم
    - ربنا يخليك
    - تحت أمرك
    - سلام
    - باي
    # Whole sentences, because that is what a parent actually types. «Thanks for your
    # help» reached the agent, was given a required tool it had no reason to call, and
    # came back to the parent as a provider error — so the fix belongs here, where a
    # listed phrase costs nothing and never fires on a question.
    #
    # Listed rather than matched by edit distance. A typo matcher that admitted this
    # would have to accept a whole SENTENCE as one phrase plus an error budget, and at
    # that point «thanks and what are the fees؟» is inside the budget too — which is the
    # one mistake this rung must not make. Misspellings that matter are cheaper to add
    # here as they are observed.
    - thanks for your help
    - thanks a lot
    - many thanks
    - thanks so much
    - thank you so much
    - شكرا على مساعدتك
    - متشكر جدا
    - متشكرة جدا
    - شكرا على المساعدة

  # A school assistant is asked plenty that the corpus is not about — homework help,
  # general knowledge, chat. Without this the catalogue rung can only admit, so those
  # reach the agent and get answered on general knowledge in the school's voice.
  #
  # This profile ships no scope catalogue, so the classifier node judges against
  # `coverage` below rather than against indexed questions and similarity scores.
  request_envelope_enabled: true

  # What the classifier compares a message against. Load-bearing on this profile and
  # nowhere else: with a catalogue the node is shown real questions the corpus is known
  # to answer, and this description is a poor substitute for that. Without one it is
  # the only thing standing between the classifier and a guess — an empty string here
  # is how an assistant starts refusing valid questions for want of anything to compare
  # them to.
  #
  # Written as prose rather than a topic list because the node has to judge messages
  # phrased in words nobody listed, in either language.
  #
  # Bilingual because this is the ONLY surface an Arabic message is compared against on
  # this profile (it ships no scope catalogue), and Arabic is the primary language here.
  # With English-only prose, every Arabic turn asked a small model to judge scope across
  # a translation gap — and the two mistakes do not cost the same: a wrong
  # `out_of_domain` refuses a parent outright, while a wrong `in_domain` spends one
  # search nobody sees. The Arabic half is written in the words parents actually type,
  # Egyptian included, so the comparison is lexical rather than a translation.
  coverage: >-
    Everything a parent or guardian asks a school: term dates, holidays and the
    calendar; fees, payment plans and discounts; admissions and registration; uniform,
    books and equipment; transport and bus routes; the school day, timetables and
    lateness; attendance and absence rules; exams, results and report cards; subjects
    and curriculum; trips and activities; medical, dietary and allergy policy; contact
    details and how to reach a teacher or the office. It also answers questions about a
    specific child's own marks, attendance and report card, for the parent signed in as
    that child's guardian.
    نفس المواضيع بالعربي، بالكلمات اللي أولياء الأمور بيستخدموها فعلاً: المصاريف
    والمصروفات والرسوم والأقساط والخصومات؛ التقديم والتسجيل والقبول؛ مواعيد الترم
    والفصل الدراسي والإجازات والنتيجة وشهادة الدرجات؛ الزي المدرسي واليونيفورم والكتب
    والأدوات؛ الباص والأتوبيس والاشتراك والمواصلات؛ جدول الحصص واليوم الدراسي والحضور
    والغياب والتأخير؛ الامتحانات والدرجات والمواد والمناهج؛ الرحلات والأنشطة؛ الحالة
    الصحية والحساسية والأكل؛ أرقام التواصل ومقابلة المدرسين ومكتب المدرسة؛ وكمان أسئلة
    ولي الأمر عن درجات وغياب وجدول ابنه أو بنته هو شخصياً.

  # Reported by the classifier when a message discloses one, and used to decide whether
  # a post-turn profile capture is worth paying for. A closed list, because free text
  # here would make the node an extractor — a different and far harder job.
  personal_data_fields:
    - child_name
    - year_group
    - phone
    - email
    - preferred_language

  # This deployment has children to talk about, so the classifier is asked whether a
  # message is about one. Deployment data, not identity: it says nothing about who is
  # asking, which is why a detector is allowed to read it.
  child_context_enabled: true

  # Two knowledge calls, because a parent question often has a policy half and a
  # records half ("is she allowed to miss Thursday, and how many days has she
  # missed?"). The records tool has its own separate budget — see
  # ChatRequestContext.acquire_records_tool_slot.
  max_knowledge_calls_per_turn: 2

  # What each tool may be called in one turn, enforced by withholding the tool from the
  # request rather than refusing the call once it arrives. `search_knowledge_base` is
  # deliberately not listed here: it takes the number above, so retrieval keeps one
  # budget rather than two that can drift apart.
  #
  # Two per record tool, because a parent asking about two children is a legitimate
  # sequence — read one, then the other. These are GRAPH budgets, deciding what stays on
  # offer; the audited-read ceiling that actually protects the facade is
  # `RECORDS_MAX_CALLS_PER_TURN`, which all three tools share, so a number raised here
  # cannot widen how much of a minor's record one turn may read.
  tool_call_budgets:
    get_student_grades: 2
    get_subject_grades: 2
    get_student_attendance: 2
    get_student_timetable: 2
    get_student_class: 2
    get_student_subjects: 2
    get_student_teachers: 2
    get_subject_teacher: 2
  default_tool_call_budget: 1

  # `recursion_limit` is deliberately NOT set here, and adding the timetable tool is what
  # tested that. Base carries it, sized against this profile's budgets — see the comment
  # on it there — because this is the profile with the most tools and therefore the one
  # that decides the number. `test_school_profile.py` asserts the two stay equal, so a
  # local override here would be a silent fork of a ceiling that is meant to be one value.

  # Bind the one tool the question needs, when the planner already knows which. This
  # deployment is where the failure was measured: with both tools on the wire, «درجات
  # ليلى أحمد كام؟» was answered by searching the fee corpus and telling a parent no
  # information about their daughter existed, while the records tool sat unused beside
  # it. Three of three runs on that question, and two more questions like it.
  #
  # Safe here specifically because this profile has both halves the switch depends on: a
  # child roster from the records facade, and a classifier that separates a question
  # about a child's own record from a school matter asked about that child. Without the
  # second, «مصاريف ابني» would be sent to the records tool, which is why it is a
  # classifier field and not a keyword rule.
  narrow_tools_to_the_turn: true

  # When the classifier names more than one tool, dispatch them together instead of
  # letting the model discover them one at a time.
  #
  # `narrow_tools_to_the_turn` above narrows to a FAMILY and stops; this acts on the
  # tool-by-tool answer `tool_selection` produces. «درجات ليلى كام والمصاريف كام؟» is classified
  # a two-part question used to mean: bind everything, let the model search, wait, read,
  # ask for the records, wait, read, answer — four model round-trips with the two lookups
  # strictly one after the other. Planned, it is one round-trip with both running at once.
  parallel_tool_calls: true

  # What a planned call looks like for each tool. A tool missing from here is never
  # pre-dispatched; it stays bound and the model calls it the ordinary way.
  #
  # There is no `record_type` to fill in any more, and that is the point of the split
  # above: WHICH record to read is now the tool's name, which the classifier selects,
  # rather than an argument the planner had to guess and the model had to correct.
  #
  # `get_subject_grades` is absent on purpose. Its `subject` argument comes from the
  # message and nothing in the plan holds it, so a planned call would have to invent one.
  # An undeclared tool stays bound and the model calls it in the ordinary way, which is
  # the right outcome for the one record tool whose argument is genuinely the model's to
  # supply — and the tool answers an unmatched subject with the subjects the child
  # actually takes, so a wrong guess there costs nothing.
  planned_tool_arguments:
    search_knowledge_base:
      query: "$resolved_question"
    get_student_grades:
      # The label the ROSTER matched, never a name the model transcribed. The tool
      # re-resolves it against the same roster, so a planned call names the same child
      # the prompt does.
      student_name: "$child_label"
    get_student_attendance:
      student_name: "$child_label"
    # Plannable for the same reason attendance is: the only argument is the child, and
    # the plan already holds her. Note there is no class here to fill in — the timetable
    # is resolved from her placement behind the facade, which is what keeps a room code
    # out of a plan that would still be holding it after she moved class.
    get_student_timetable:
      student_name: "$child_label"
    # The rest, whose planned argument is the child and nothing else. `get_student_grades`
    # and `get_student_teachers` also accept a `subject`, and it is deliberately not named
    # here: `PLAN_PLACEHOLDERS` is a closed set with no `$subject` in it, so a planned call
    # would have to invent one. Omitting it plans the whole record and lets the model read
    # the row it was asked about out of what came back — which is why folding the subject
    # variants in made every tool plannable instead of making two of them unplannable.
    get_student_class:
      student_name: "$child_label"
    get_student_subjects:
      student_name: "$child_label"
    get_student_teachers:
      student_name: "$child_label"

  # What each tool is for, for the classifier to choose between. This is what makes
  # selection work past the two-tool case, and it is now also what decides WHICH record
  # is read — so a new capability is a tool plus a line here, and nothing else.
  #
  # Written for a node that judges a message it must not act on, so each line states
  # SUBJECT MATTER and nothing else: no instruction to call anything, and no worked
  # example. An example here is a sentence the classifier can mistake for the message it
  # was given — this deployment has already had model-facing example text reproduced
  # verbatim as an answer and as a search query.
  tool_selection:
    search_knowledge_base: >-
      The school's own published material, the same for every family: fees and
      instalments, term dates and holidays, admissions, uniform, books and equipment to
      buy, transport and bus routes, the school day, attendance rules, exam schedules,
      trips, medical policy, contact details. Not which subjects one child's class is
      assigned, which class the child is in, or who teaches them — those differ per child
      and have their own tools.
    get_student_grades: >-
      One child's own marks across every subject this term — how they are doing overall,
      their results, their report card, what they scored, whether they are doing well.
      This is the one to name when the message asks about marks without naming a
      particular subject, including when it says so in dialect and uses no word meaning
      "marks" at all.
    get_subject_grades: >-
      One child's own marks inside a single school subject, assignment by assignment.
      This is the one to name whenever the message names a subject — maths, science,
      Arabic, English and so on — however briefly.
    get_student_attendance: >-
      One child's own attendance: the days they were present, absent or late.
    get_student_timetable: >-
      One child's own weekly class schedule — which lessons fall on which day, what the
      child has on a particular day, when a subject is taught, and what their school day
      looks like. This is the one to name when the message asks about a schedule or a timetable
      rather than about marks or absences, including when it says so in dialect. It is not
      for term dates, holidays or exam schedules, which are the same for every family.
    get_student_class: >-
      Which class one child is in, and what that class is called. For a message asking
      about the child's class, section or which room they are in — not what happens in it.
    get_student_subjects: >-
      Which subjects one child studies — the list of subjects their class is taught. For
      a message asking what the child studies or which subjects they take, without asking
      about marks in them or when they are taught. This one covers their curriculum too:
      the subjects THAT child's class is assigned are their own record, not published
      material.
      بالعربي: مواد ابني، بياخد أنهي مواد، بتدرس ايه، كام مادة، المنهج بتاعه، بياخد مادة
      معينة ولا لأ.
    get_student_teachers: >-
      All of one child's teachers at once, and which subject each of them takes. This is
      the one to name only when the message asks about their teachers in general and names
      NO subject. If any subject is named, however briefly, name get_subject_teacher
      instead — this tool would answer with every teacher the child has, which is not what
      was asked.
      بالعربي: مين مدرسين ابني، اسماء المدرسين بتوع فصله، مين بيدرسله — من غير ما يذكر مادة
      بعينها.
    get_subject_teacher: >-
      Who teaches one child ONE named subject, and nobody else. This is the one to name
      whenever the message names a subject — maths, science, Arabic, English and so on —
      however briefly, and whatever else the message also asks for. Naming the subject is
      what chooses it, including dialect and feminine wordings of both the subject and the
      teacher.
      بالعربي: مين مدرس الرياضيات/الحساب/العلوم/العربي لابني، مين مدرسة العلوم بتاعة بنتي،
      استاذ المادة الفلانية اسمه ايه، بياخد المادة دي مع مين.

  # A fee, an instalment, a deadline — the figures in this corpus are what a parent acts
  # on, so a figure that is in no retrieved chunk must not be served. Enforced rather
  # than observed because the failure this closes actually reached a parent: an invented
  # «45 ألف» for a grade the child is not in. See backend/chat/grounding.py.
  # An answer that tells a parent no record exists, on a turn where the records tool
  # returned one. Measured here: the tool came back with 87.5% and 91.0% for a named
  # child and the reply was "I couldn't find any records." The numeric check above cannot
  # see it — a denial states no figure, and a mark is under the 100 floor in any case.
  #
  # `observe` and not `enforce`, for now and on purpose. The half of this check that
  # reads the tool is fact; the half that reads the ANSWER is the list below, and a
  # phrase list is the part that can be wrong about a correct reply. Observing puts every
  # disagreement in the trace and the log, which is the evidence this deployment needs
  # before it lets the check rewrite an answer a parent would otherwise have read.
  records_denial_mode: observe
  # Folded before matching, so a different alif or teh marbuta does not slip past.
  records_denial_phrases:
    - "ما لقيتش"
    - "مالقيتش"
    - "لم أجد"
    - "لا توجد"
    - "مفيش"
    - "مش موجود"
    - "couldn't find"
    - "could not find"
    - "no records"
    - "not find any"

  answer_grounding_mode: enforce

  # Six turns of conversation, which is TWELVE messages — this is counted in messages,
  # not exchanges, and setting it to 6 would give a parent three turns of memory.
  #
  # Six is chosen rather than inherited because this is the profile where the history
  # window does real work: it is what lets the model follow "and what about his
  # timetable?" back to the child settled two turns ago, without anything having to
  # detect the Arabic enclitic possessive that question takes. The durable pin
  # (backend/chat/child_context.py) is the mechanism; this window is what makes the
  # model's own reading of the conversation agree with it.
  context_window_messages: 12

models:
  # 0.3 on a 20B model code-switches and drifts grammatically more in Arabic than in
  # English, and this domain wants fees and dates stated the same way twice rather than
  # varied. The other roles are already deterministic.
  answer_temperature: 0.2

# Everything the system says WITHOUT a model composing it.
#
# `out_of_domain` and `social` are the only two the schema carries per-language; the
# rest are single strings, so on an Arabic-first deployment they are written in Arabic.
# That is a deliberate trade: an English-writing parent gets Arabic on these paths,
# which is the right way round when Arabic is primary and these are the moments the
# assistant is least helpful anyway. The two localized fields still switch correctly.
#
# Register matches agent.system_prompt above — these sit next to model-written replies
# in the same conversation, and base's MSA boilerplate reads as a different assistant.
user_copy:
  # Asked with no model call when this parent's own roster holds more than one child
  # matching what they said — "my son" with two sons on file. The names follow as
  # selectable options, so the question deliberately does not list them itself: a parent
  # taps one rather than re-typing a name the school already knows how to spell.
  which_child:
    en: Which child do you mean?
    ar: حضرتك تقصد أنهي واحد فيهم؟
  out_of_domain:
    en: >-
      That's outside what I can help with here — I answer questions about the school.
      Ask me about those and I'll do my best.
    ar: >-
      ده خارج اللي أقدر أساعد فيه هنا — أنا بجاوب على أسئلة المدرسة زي المصاريف
      والمواعيد والغياب ودرجات ابنك. اسألني في حاجة من دول وأنا تحت أمرك.
  social:
    en: "Happy to help — what would you like to know?"
    ar: "أهلاً بحضرتك، تحت أمرك — عايز تعرف إيه؟"
  no_knowledge: >-
    المعلومة دي مش موجودة في مصادر المدرسة اللي عندي دلوقتي، ومش عايز أقولك حاجة
    مش متأكد منها. أنصح حضرتك تتواصل مع مكتب المدرسة.
  retrieval_error: >-
    في مشكلة تقنية مؤقتة منعتني أوصل لمصادر المدرسة. ممكن حضرتك تجرّب تاني بعد شوية؟
  unverified_answer: >-
    معلش، مقدرتش أتأكد من الأرقام دي من مستندات المدرسة نفسها، ومش عايز أقول لحضرتك رقم
    غلط في حاجة زي المصاريف. الأفضل تتواصل مع مكتب المدرسة عشان الرقم الأكيد.
  hitl_clarify_default: >-
    لقيت محتوى قريب من سؤالك، بس المعلومات مش كفاية أحدد إجابة أكيدة. ممكن حضرتك
    تديني تفاصيل أكتر؟
  hitl_clarify_missing_slots: "لقيت محتوى قريب، بس ناقصني: "
  hitl_scope_default: "لقيت أكتر من موضوع ممكن يكون ده اللي حضرتك بتسأل عنه. أنهي واحد فيهم؟"
  hitl_clarify_agent: >-
    لقيت المعلومة تقريباً، بس ناقصني تفصيلة واحدة عشان أكمّل. ممكن حضرتك توضحهالي؟
  hitl_scope_agent: "لقيت أكتر من قسم ممكن يكون فيه إجابة سؤالك. تحب أدوّر في أنهي واحد؟"
  new_session_title: "محادثة جديدة"
  unsupported_file_type: "الملفات المدعومة هي PDF و Word و Excel و HTML بس"

assets:
  figures:
    # Turns off the qwen3 scratchpad on the vision model this deployment runs
    # (VISION_MODEL=qwen/qwen3.6-27b on Groq). Ingest sends one vision call per image
    # and the scratchpad is reserved against the tokens-per-minute quota before any
    # answer is written, so on a small quota this reclaims more room than raising
    # vision_max_output_tokens can.
    #
    # It has to go here rather than in `vision_reasoning_effort`, and rather than in
    # VISION_REASONING_EFFORT: that field's validator folds "none" to "", which means
    # SEND NO reasoning parameter — leaving the model's own default (reasoning on).
    # Only extra_params can put the literal string on the wire. See
    # FigurePipelineConfig._validate_vision_effort, and supermew.yaml, which carries
    # this same block for the same model.
    vision_extra_params:
      reasoning_effort: none

retrieval:
  # School corpora are small and repetitive — fee tables, calendars, policy pages
  # restated per year group — so recall matters more than precision here.
  top_k: 8
  candidate_k: 30
