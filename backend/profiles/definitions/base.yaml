# Base profile — the neutral, domain-agnostic defaults every other profile inherits.
#
# Values here reproduce the behaviour the system had before profiles existed, so
# `extends: base` with no overrides is a no-op. Domain profiles override only what
# their domain actually changes.
#
# Precedence: environment variable > this file (and anything extending it) > schema default.

profile_version: 1
name: base

identity:
  name: "Knowledge Assistant"
  display_name: "Knowledge Assistant"
  api_title: "Knowledge Assistant API"
  description: "Retrieval-augmented knowledge base assistant"
  persona: "You are a helpful knowledge-base assistant."
  redis_key_prefix: "kb"
  langsmith_project: "kb-rag"

models:
  answer_temperature: 0.3     # conversational answering
  fast_temperature: 0.2       # FAST_MODEL for the persistent-note summariser
  planner_temperature: 0.0    # FAST_MODEL for complexity classification (deterministic)
  grade_temperature: 0.0      # GRADE_MODEL evidence grading (deterministic)
  rewrite_temperature: 0.0    # FAST_MODEL for Step-back / HyDE planning (deterministic)

agent:
  tools:
    - get_current_weather
    - search_knowledge_base
    - view_figure
  recursion_limit: 8
  max_knowledge_calls_per_turn: 1
  max_figure_calls_per_turn: 3
  context_window_messages: 6
  persistent_note_max_chars: 500

  # Direct-answer path used when a HITL clarification is resumed (bypasses the agent).
  resume_answer_prompt: >-
    You are a helpful knowledge-base assistant.
    Answer the user's original question using only the retrieved chunks.
    You MUST cite source chunks inline with [1], [2], etc.
    If the chunks are insufficient, say so honestly.
    Do not mention internal HITL or RAG implementation details.

  # Rolling conversation summary. {max_chars} is substituted from
  # agent.persistent_note_max_chars.
  persistent_note_prompt: |-
    You are a [Context Manager Agent], responsible for maintaining the "persistent note" across multi-turn conversations.
    The note is the model's long-term working memory under a limited context window, recording resolved questions and key facts.

    Update rules:
    1. Intelligently merge new information into the existing note; do not simply append it.
    2. Filter out noise and keep it under {max_chars} characters, using concise bullet points.
    3. If information conflicts, keep the most reliable or most recent version.
  # {persona} is substituted from identity.persona. Everything after it is the
  # tool-and-citation contract, which is domain-independent.
  system_prompt: >-
    {persona}
    When responding, you may use tools to assist.
    Use search_knowledge_base when users ask document/knowledge questions.
    Do not call the same tool repeatedly in one turn. At most one knowledge tool call per turn.
    After receiving a search_knowledge_base result you MUST NOT call search_knowledge_base
    or get_current_weather again in that turn.
    The one exception is view_figure. If a retrieved chunk references a figure and its
    caption and transcription do not answer the question, call view_figure with that
    asset_id and the specific question, then answer. Do not call view_figure when the
    retrieved text already answers the question, and never invent an asset_id.
    Once you have what you need, produce the Final Answer immediately.
    If the tool result starts with NEEDS_CLARIFICATION or NEEDS_SCOPE_SELECTION, ask the user
    the requested question directly and do not answer from retrieved context.
    If the tool result starts with NO_KNOWLEDGE, say the knowledge base does not contain
    reliable relevant information.
    If the tool result starts with RETRIEVAL_ERROR, tell the user a temporary technical issue
    prevented searching the knowledge base and to try again shortly; do NOT claim the knowledge
    base lacks the information.
    If the retrieved context is insufficient, answer honestly that you don't know instead of
    making up facts.
    When answering based on retrieved chunks, you MUST cite the source chunks using their index
    numbers inline, for example [1] or [2][3].
    Step-back questions and HyDE documents are retrieval aids only, not factual evidence.
    Base factual claims only on retrieved source chunks and do not reveal chain-of-thought.
    If you don't know the answer, admit it honestly.

rag:
  max_rewrites: 1
  max_sub_questions: 4

  # The grader is one synchronous LLM call per retrieval — and one per sub-agent on a
  # decomposed question — so it is usually the dominant latency in a turn. In
  # uncertain_only it runs unless retrieval is clearly on target. Every threshold below
  # must hold before it is skipped: skipping wrongly means answering from weak
  # evidence, while grading unnecessarily only costs time.
  #   always | uncertain_only | never   (never also disables rewrite and HITL)
  # The ladder's semantic rung. Off until its latency is measured on target hardware;
  # turning it on is also what makes `evidence_required_certainty: medium` meaningful.
  rerank_cross_encoder_enabled: false
  rerank_cross_encoder_model: BAAI/bge-reranker-v2-m3
  rerank_cross_encoder_device: cpu
  rerank_doc_char_limit: 2000
  rerank_sufficient_score: 0.6
  rerank_irrelevant_score: 0.05
  rerank_min_supporting_chunks: 1

  # Out-of-domain rejection before any search. Off until the threshold is calibrated
  # against a corpus — an uncalibrated gate silently refuses valid questions.
  domain_gate_enabled: false
  domain_gate_min_similarity: 0.35
  domain_gate_topic_count: 3
  domain_gate_skip_with_history: true
  domain_gate_min_question_chars: 12

  # How far the assessor ladder must climb before a report may be acted on.
  #   low | medium | high
  evidence_required_certainty: high
  evidence_lexical_enabled: true

  # Held at `always` until a semantic assessor exists. The skip decision used to rest
  # on lexical term coverage, which reads 0 whenever the question and the corpus differ
  # in language or vocabulary — so it could not tell "retrieval missed" from "retrieval
  # hit but worded it differently", and it never measured meaning at all. Move this to
  # uncertain_only once the reranker supplies calibrated per-chunk scores.
  grading_mode: always
  skip_grading_min_chunks: 3
  skip_grading_term_coverage: 0.75
  skip_grading_top_chunks: 3
  skip_grading_min_rerank_score: 0.5

  # Retrieval returns a fixed top_k; answering rarely needs all of it. The retrieved
  # set is trimmed to its useful prefix AFTER grading, so the grader still judges on
  # complete evidence and only the answer prompt sees the shorter context. Questions
  # asking for a complete set are never trimmed, and a chunk shorter than
  # context_min_chunk_chars can never be the one that ends selection.
  #   adaptive | off
  # Off for the same reason, plus a sharper one: trimming after the grader has ruled on
  # the full set means answering from narrower evidence than was judged sufficient. Once
  # the grader reports WHICH chunks carried its judgement, trimming to those is not
  # narrowing and this can go back to adaptive.
  context_selection_mode: "off"
  context_min_chunks: 1
  context_target_coverage: 1.0
  context_min_chunk_chars: 120
  fast_path_max_chars: 48
  fast_path_short_intent_chars: 18

  evidence_grade_prompt: |-
    You are a RAG evidence grader. Based only on the retrieved snippets, judge whether they are sufficient to answer the user's question. Do not add information that is not in the snippets.

    User question:
    {question}

    Retrieved snippets:
    {context}

    Give a structured result following these rules:
    - relevance: none means the topic is unrelated; weak means the topic is close but the evidence is weak; strong means the topic is clearly relevant.
    - answerability: none means it cannot be answered; partial means there are some clues but not enough for a definitive answer; sufficient means the snippets can directly or jointly support an answer.
    - ambiguity: missing_slot means a key condition is missing (e.g. role name, version, file type, module name, product line); multiple_candidates means several candidate directions could all be relevant; none means there is no clear ambiguity.
    - route may only be one of: answer, rewrite, clarify, scope_select, no_knowledge.
      answer: relevance=strong and answerability=sufficient.
      rewrite: there is a relevant signal, but the evidence is insufficient, likely due to phrasing, aliasing, or generalization level.
      clarify: a key condition is missing and the user needs to provide it.
      scope_select: multiple candidate directions are relevant and the user needs to choose one.
      no_knowledge: no recall, or the topic is unrelated.
    - If route is clarify or scope_select, provide hitl_prompt; if options can be listed, provide hitl_options.

  complexity_prompt: |-
    You are a question complexity planner. Determine the complexity of the user's question.

    [Simple question]: factual lookups, definition lookups, single-information-point queries, clear either/or questions, or queries about a specific attribute/parameter/spec.
    A question is STILL simple when its answer happens to be a list — "what are the partners", "which subjects are taught", "what does the uniform include". Retrieving one passage answers all of those.
    [Complex question]: questions that need cross-document synthesis, multi-angle analysis, comparisons between two or more named things, multi-step reasoning, or several genuinely independent information needs.

    Default to simple. Decomposition costs one retrieval and one grading call per sub-question, so only choose complex when a single retrieval genuinely cannot answer the question. If you are unsure, answer simple.

    User question: {question}

    If it's a complex question, also provide 2-4 non-overlapping, independently retrievable sub-questions; if it's a simple question, leave sub_questions empty.

  rewrite_prompt: |-
    You are a RAG query-rewrite planner. The initial retrieval already found a relevant signal, but the evidence is insufficient. Choose exactly one rewrite method — step_back or hyde — and generate the content that method needs.

    Selection rules:
    - step_back: the original question is too specific, containing entity names, model numbers, dates, conditions, or details; it needs to be raised to a more general concept, mechanism, or principle before retrieving again.
    - hyde: the original question is vague, highly conceptual, or lacks terminology commonly used in the knowledge base; it's better to first generate a plausible answer-like document, then use that document to retrieve real evidence.

    Constraints:
    - ALWAYS return all three fields. Providers that enforce strict JSON schemas reject a response with a field omitted, so the unused field must be present as an empty string "" — never left out.
    - When method=step_back, put your question in step_back_question and set hyde_document to "".
    - When method=hyde, put your document in hyde_document and set step_back_question to "".
    - The HyDE document is for retrieval only and does not represent real evidence — do not fabricate citations or sources.

    User question: {query}

  # Single-fact phrasings that must beat the complex markers below. "how many" and
  # "how much" both contain "how ", which also opens an analytical question; without
  # this override a plain count or price lookup is sent to the planner and can be
  # decomposed into several sub-questions, each costing a retrieval and a grader call.
  simple_override_markers:
    ["how many", "how much", "how long", "how old", "how far",
     "كم عدد", "كم سعر", "كم تكلفة", "كم مدة"]

  # Local fast-path classification vocabulary. Multilingual by default (English,
  # Chinese, Arabic); a domain profile replaces these wholesale with its own terms.
  simple_query_markers:
    ["是什么", "是谁", "哪里", "何时", "多少", "是否", "哪个", "哪种", "属性", "参数",
     "规格", "定义", "含义",
     "what is", "what are", "who is", "who are", "where is", "where are",
     "when is", "when are", "which is", "which are", "how many", "which",
     "list of", "name of", "names of",
     "ما هو", "ما هي", "من هو", "من هي", "أين", "اين", "متى", "متي", "كم", "هل",
     "أي ", "اي ", "تعريف", "معنى"]

  complex_query_markers:
    ["比较", "对比", "区别", "差异", "优缺点", "优势", "劣势", "分析", "总结", "综合",
     "原因", "成因", "影响", "方案", "步骤", "如何", "为什么", "以及", "同时", "并且",
     "和", "与", "谁更",
     "compare", "versus", "difference", "different", "analyze", "summarize",
     "trade-off", "pros and cons", "why ", "how ", " and ", "complex",
     "قارن", "مقارنة", "الفرق", "الفروق", "فرق بين", "بين ", "مقابل", "لماذا", "كيف",
     "اشرح", "وضح", "حلل", "تحليل", "لخص", "ملخص", "مميزات", "عيوب", "إيجابيات",
     "سلبيات", "أسباب", "اسباب", "خطوات", "وأيضا", " و ", "أم ", "ام ", "كذلك"]

  query_dimension_markers:
    ["属性", "武器", "定位", "技能", "机制", "参数", "规格", "性能", "价格", "优点",
     "缺点", "作用",
     "الرسوم", "المواعيد", "الشروط", "المستندات", "المناهج", "الأنشطة", "النقل"]

retrieval:
  top_k: 8
  candidate_k: null
  candidate_multiplier: 3
  leaf_retrieve_level: 3
  auto_merge_enabled: true
  auto_merge_threshold: 2
  # null = never merge a parent group containing a figure, so one citation points
  # at one image. Text-only groups still merge at auto_merge_threshold.
  auto_merge_figure_threshold: null
  rerank_min_score: 0.0
  rerank_doc_char_limit: 2000
  rerank_timeout_seconds: 5.0

chunking:
  strategy: recursive
  chunk_size: 800
  chunk_overlap: 100
  l1_size: null          # null derives from chunk_size (max(2000, size * 3))
  l2_size: null          # null derives from chunk_size (max(1000, size * 2))
  sentence_overlap: 1
  merge_target_divisor: 4
  layout_parser_enabled: true
  semantic_dedup_enabled: false
  semantic_dedup_threshold: 0.97

user_copy:
  no_knowledge: "The knowledge base does not contain reliable relevant information, so this question can't be answered from it right now."
  retrieval_error: "A temporary technical issue prevented searching the knowledge base. Please try again in a moment."
  hitl_clarify_default: "I found relevant content, but the evidence isn't enough to determine an answer. Please provide more detail about what you're asking."
  hitl_clarify_missing_slots: "I found relevant content, but key information is still missing: "
  hitl_scope_default: "I found several possibly relevant directions in the knowledge base. Which one are you asking about?"
  hitl_clarify_agent: "I found relevant knowledge, but I'm still missing one key piece of information. Please provide it so I can continue."
  hitl_scope_agent: "I found several knowledge base scopes that might be relevant. Please choose which one you'd like to continue querying."
  new_session_title: "New session"
  unsupported_file_type: "Only PDF, Word, Excel, and HTML documents are supported"

assets:
  enabled: true
  blob_backend: local          # local | s3 (s3 targets MinIO; credentials come from env)
  blob_root: "data/assets"     # relative paths resolve against the project root
  blob_bucket: "kb-assets"     # s3 only — must NOT be the bucket Milvus uses
  gc_orphan_blobs: true
  max_images_per_document: 500

  # Entity (product) extraction. Off in base: a document knowledge base has no
  # catalogue. A domain turns it on and declares its own attribute vocabulary, from
  # which the extraction schema, the search_products signature, filter validation,
  # and the attribute index are all generated.
  entities:
    enabled: false
    vision_enabled: false
    role_strategy: figure     # figure | entity | auto
    attributes: []
    candidate_pool: 200
    max_results: 20

  # How retrieved assets reach a client. Nothing here is UI-specific: the backend
  # publishes structured references and each consumer declares its own capabilities
  # per request, so replacing the frontend needs no change on this side.
  delivery:
    base_path: "/media"   # not /assets — that collides with Vite's build output
    attach_to_response: true
    max_assets_per_response: 8
    # Show only the figures the answer cited, not every figure retrieval touched.
    attach_only_cited: true
    max_inline_bytes: 512000      # ceiling on base64 inlining, whatever a client asks for
    cache_max_age_seconds: 31536000   # content-addressed, therefore immutable
    max_pixel_reads_per_asset: 2      # after this, answer from recorded observations
    max_observations_per_asset: 6
  # Deterministic pre-filter; every image rejected here is a VLM call never made.
  triage:
    min_width: 64
    min_height: 64
    min_area: 8000
    max_aspect_ratio: 12.0
    min_byte_size: 1024
    repeat_page_fraction: 0.6
    complex_min_area: 250000

  # Figure extraction: turning document images into a retrievable text surface.
  figures:
    enabled: true
    # Requires a vision-capable VISION_MODEL (or MODEL). With it off, figures are
    # still retrievable via alt text and caption lines — no model cost, but scanned
    # pages and image-only tables stay unreadable.
    vision_enabled: true
    vision_temperature: 0.0
    vision_max_edge: 1024
    # `input + this` is reserved against the provider's tokens-per-minute quota before
    # generation starts, so it is a ceiling as much as a floor. 4096 clears the
    # truncation floor while leaving room for a ~3k-token image inside an 8k quota.
    vision_max_output_tokens: 4096
    # A rate limit is transient; without these a single 429 permanently demotes an
    # image to the heuristic path and the document silently loses its figures.
    vision_retry_attempts: 4
    vision_retry_base_seconds: 5.0
    vision_retry_max_seconds: 90.0
    # Provider passthrough. On a reasoning model the scratchpad can consume the entire
    # output budget before any answer is written — turning it off reclaims that far
    # more effectively than raising the budget (which the quota caps anyway).
    # Groq/qwen3:  {reasoning_effort: none}
    vision_extra_params: {}
    render_dpi: 150
    context_chars: 600
    max_tags: 8
    max_answerable_questions: 4
    escalate_below_confidence: 0.45
    extraction_prompt: |-
      You are extracting a document figure into text so that it can be found by search and answered from later, without anyone re-opening the image.

      Context around the image:
      {context}

      Produce:
      - caption: one line naming what this image IS. Prefer the document's own caption wording when the context supplies it.
      - description: what the image shows and how to read it. State the subject, the axes or columns, and the units. Do not speculate beyond what is visible.
      - transcription: EVERY piece of text visible in the image, verbatim, including axis labels, legends, units, and footnotes. If it is a chart or a table, also render the underlying values as a markdown table. This field is what lets a text-only model answer questions about the figure later, so completeness here matters more than brevity.
      - tags: short topical keywords a person might search for.
      - image_type: the closest category.
      - answerable_questions: up to four questions this image can answer, phrased the way a user would actually ask them.
      - confidence: how legible and complete your reading was, from 0 to 1. Report low confidence honestly when the image is blurry, cropped, or you cannot read the text — a low score sends it for re-extraction rather than into the index as fact.

      Write in the language of the document. Never invent values you cannot see.

ingest:
  supported_extensions: [".pdf", ".docx", ".doc", ".xlsx", ".xls", ".html", ".htm"]
  asset_pipelines: []
  indexes: ["kb_chunks"]
