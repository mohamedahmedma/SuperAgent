# Alembic configuration for the chat backend's Postgres schema.
#
#     alembic -c backend/alembic.ini upgrade head
#     alembic -c backend/alembic.ini revision --autogenerate -m "add x" --rev-id 0003
#
# The same conventions as sis/alembic.ini, for the reasons written out there: every path
# is written against %(here)s so the command works from any directory, revisions are
# numbered so `versions/` reads in apply order (pass --rev-id), and there is no
# sqlalchemy.url — env.py takes DATABASE_URL from the environment, or `-x db_url=...`,
# so no credential lives in git and no environment silently migrates someone else's
# database.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
