[project]
name = "SuperAgent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    # Imported directly, so declared directly rather than trusted to arrive with something
    # else. The model provider clients (backend/llm_http.py) are transports for the SAME
    # HTTP library the OpenAI SDK is built on, so the two are pinned together: openai 3.x
    # moves to its `httpx2` fork, and those transports would have to follow it.
    "openai>=2.29,<3",
    "httpx>=0.28.1,<1",
    "anyio>=4.12",
    # The streamed chat route's BackgroundTask, and the embedding client's Retry.
    "starlette>=0.52",
    "urllib3>=2.6",
    "pymilvus>=2.5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.37",
    "langchain-community>=0.2.12",
    "langchain-text-splitters>=0.2.2",
    "langchain-huggingface>=0.1.0",
    "langchain-openai>=0.1.22",
    "sentence-transformers>=3.0.0",
    "torch>=2.0; sys_platform == 'linux'",
    "langgraph>=0.2.31",
    "pypdf>=4.3.1",
    "pdfplumber>=0.11",
    "docx2txt>=0.8",
    "python-docx>=1.1",
    "unstructured",
    "openpyxl",
    "tabulate",
    "msoffcrypto-tool",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    # Runtime, not dev: the backend image runs `alembic upgrade head` before uvicorn, and
    # the app reads the migration directory's head revision at startup.
    "alembic>=1.13.0",
    "redis>=5.2.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "beautifulsoup4>=4.12.0",
    "langsmith>=0.7.22",
    # Domain profile definitions (backend/profiles/definitions/*.yaml). Previously
    # available only transitively via langchain-core; imported directly now.
    "pyyaml>=6.0",
    # Prompt templates (backend/prompts/templates/**/*.j2). Same story as pyyaml: it
    # arrives transitively via fastapi/langchain today, but backend.prompts imports it
    # directly, so it is declared rather than relied on as someone else's dependency.
    "jinja2>=3.1",
    # Arabic matching (backend/text_matching.py), on the BM25 and name-lookup lanes.
    #
    # camel-tools supplies the standard Arabic IR normalizers (dediac, alef, alef
    # maksura, teh marbuta). Only `camel_tools.utils.{normalize,dediac}` is imported —
    # pure Python, no model data, no `camel_data` download at runtime. It declares torch
    # and transformers, but sentence-transformers already pulls both, so the marginal
    # weight here is small.
    #
    # snowballstemmer supplies the Arabic LIGHT stemmer. The choice matters: NLTK's
    # ISRI reduces to the triliteral root, which merges طالب (a student) with طلب (an
    # application) and مدرسة with تدريس. Snowball strips clitics and stops, which is
    # what BM25 wants. See test_text_matching.LightStemmingTests.
    "camel-tools>=1.5",
    "snowballstemmer>=2.2",
    # Token accounting. The agent system prompt is paid on EVERY turn and the
    # school profile budgets it at 500 tokens (test_prompt_budget.py), which is
    # only checkable with the real tokenizer — Arabic runs about three tokens a
    # word here, so character counts are not a usable proxy. document_loader
    # already looks for it optionally for CHUNK_STRATEGY=token.
    "tiktoken>=0.7",
]

[project.optional-dependencies]
study = [
    "langchain-classic>=0.2.0",
    "chromadb>=0.5.5",
    "bilibili-api-python>=17.0.0",
]

# NOTE: there is no [build-system] here and uv locks this project as
# `source = { virtual = "." }`, so setuptools never runs and this table is inert
# today. It is kept correct for the day the project is built: src/ is the package
# root. What actually puts the packages on sys.path is pythonpath below for pytest,
# PYTHONPATH in each image, and an explicit insert in each standalone script.
[tool.setuptools.packages.find]
where = ["src"]
# `schoolauth` ships with the backend because the backend imports it: it is the shared
# token verifier every enforcement point compiles in. Leaving it out builds a wheel that
# imports fine until the first authenticated request.
include = ["backend*", "schoolauth*"]
exclude = ["frontend*", "tests*"]

# Templates and profile definitions are data, not modules, so packages.find alone does
# not ship them — an installed build would import fine and then fail at first render.
[tool.setuptools.package-data]
"backend.prompts" = ["templates/**/*.j2"]
"backend.profiles" = ["definitions/*.yaml"]
# The migration directory is not a package either, and the app reads its head at startup.
"backend" = ["alembic.ini", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

# The suites import the services directly and nothing is installed, so pytest has to
# be told where they live. Without this every `from backend...` under tests/ fails.
[tool.ruff]
# The codebase's own convention, measured rather than guessed: p95 of every line under src/
# is 89 characters and p99 is 97. Ruff's default of 88 would rewrap 6.5% of all lines for
# nothing; 100 leaves the existing hand-wrapping alone.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow. `F` and `B` find real defects, `E4`/`E7`/`E9` find real mistakes, and
# `I` is mechanical and safe. Left OUT for now, each for a reason rather than by oversight:
#   UP    1,327 sites of `List[x]` -> `list[x]` and `Optional[x]` -> `x | None`. Worth doing,
#         but it is a modernisation pass of its own, not a foundation commit.
#   ARG   775 hits, and nearly all are Protocol conformance or callback signatures, where an
#         unused argument is the point.
#   E1/E2/E3, E501  code width and whitespace belong to the formatter; comments and
#         docstrings here are wrapped by hand and are the most valuable text in the repo.
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = [
    # `Depends(...)`, `File(...)` and `Form(...)` in a default argument IS FastAPI's idiom.
    "B008",
    # 29 sites. `zip(strict=True)` would be a real improvement, but it CHANGES behaviour by
    # raising on length mismatch, and `strict=False` just restates the status quo. Audit the
    # sites deliberately in their own commit instead of sweeping them here.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# E402 (imports not at top of file) is load-order, not sloppiness: every one of these sets
# an environment variable, or stubs a module, BEFORE the first import of a service, because
# the modules it reaches read their configuration once at import. conftest.py's docstring
# explains the same constraint for the suites.
"conftest.py" = ["E402"]
"src/backend/app.py" = ["E402"]
"src/backend/infra/database.py" = ["E402"]
"src/backend/agent/rag/utils.py" = ["E402"]
"tests/sis/conftest.py" = ["E402"]
"tests/evals/*.py" = ["E402"]
# Asserting against a bare Exception is how these check that a boundary refuses at all,
# separately from the tests that pin which error it refuses with.
"tests/**/*.py" = ["B017"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "pytest>=8.3.0",
    # Lint and format. Configured under [tool.ruff] below; CI runs both as checks so a
    # formatting difference fails the build rather than arriving in someone else's diff.
    "ruff>=0.14",
    # Enforces the dependency rule between the layers. Contracts live in .importlinter,
    # and they cover the NEW packages only until step 6G moves the last slice.
    "import-linter>=2.3",
]

# Linux containers run the embedding model on CPU. Without an explicit source,
# PyPI's Linux torch wheel pulls several gigabytes of unused CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
