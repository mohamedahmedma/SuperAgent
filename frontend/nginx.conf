server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, and a variable in every proxy_pass below. Together they make
    # nginx look `backend` and `identity` up per request (cached ten seconds) instead of
    # once at startup. With a literal `proxy_pass http://backend:8000` the address is
    # resolved when nginx boots and kept for the life of the process, so recreating the
    # backend — which can give it a new address on the network — left this container
    # forwarding every API call to a container that no longer existed. The site loaded
    # and every click answered 502 (2026-09-11). A release that recreates the backend but
    # not the frontend is the normal case, so correctness cannot depend on restarting this
    # container as well.
    #
    # A variable holding only scheme, host and port passes the request URI through
    # unchanged, exactly like the literal form did. It also means nginx starts even while
    # the backend is down, instead of refusing to boot on "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $identity_upstream http://identity:8200;
    set $backend_upstream http://backend:8000;

    location /v1/ {
        proxy_pass $identity_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(chat|sessions|documents|media)(/|$) {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite writes content-hashed filenames here, so a changed file is a changed URL and
    # the previous one is never requested again. Caching these forever is therefore safe,
    # and it is what keeps a deploy from re-downloading fonts and vendor chunks that did
    # not change. `expires` is deliberately not used alongside this: it would emit its own
    # Cache-Control and the response would carry the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the opposite case: a stable URL whose content changes on every
    # release, because it is what names the hashed bundles above. Without this it is
    # served from the browser cache after a deploy, so the visitor keeps running the
    # previous release — and a hard refresh looks like the only way to ship anything.
    # `no-cache` still allows caching; it requires revalidation first, so an unchanged
    # release answers 304 rather than re-sending the file. This mirrors what the SIS
    # console already does for its own bundle in sis/app.py.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
