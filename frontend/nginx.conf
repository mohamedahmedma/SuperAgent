server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://identity:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(chat|sessions|documents|media)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite writes content-hashed filenames here, so a changed file is a changed URL and
    # the previous one is never requested again. Caching these forever is therefore safe,
    # and it is what keeps a deploy from re-downloading fonts and vendor chunks that did
    # not change. `expires` is deliberately not used alongside this: it would emit its own
    # Cache-Control and the response would carry the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the opposite case: a stable URL whose content changes on every
    # release, because it is what names the hashed bundles above. Without this it is
    # served from the browser cache after a deploy, so the visitor keeps running the
    # previous release — and a hard refresh looks like the only way to ship anything.
    # `no-cache` still allows caching; it requires revalidation first, so an unchanged
    # release answers 304 rather than re-sending the file. This mirrors what the SIS
    # console already does for its own bundle in sis/app.py.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
